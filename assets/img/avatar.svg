<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D97757"/>
      <stop offset="100%" style="stop-color:#C4633F"/>
    </linearGradient>
  </defs>

  <!-- 배경 원 -->
  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>

  <!-- 별 모양 -->
  <g transform="translate(100,100)" fill="white">
    <ellipse cx="0" cy="0" rx="14" ry="52"/>
    <ellipse cx="0" cy="0" rx="52" ry="14"/>
    <ellipse cx="0" cy="0" rx="14" ry="52" transform="rotate(45)"/>
    <ellipse cx="0" cy="0" rx="14" ry="52" transform="rotate(-45)"/>
  </g>
</svg>
