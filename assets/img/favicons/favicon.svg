<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D97757"/>
      <stop offset="100%" style="stop-color:#C4633F"/>
    </linearGradient>
  </defs>

  <!-- 배경 라운드 사각형 -->
  <rect width="100" height="100" rx="22" ry="22" fill="url(#bg)"/>

  <!-- 별 모양 (클로드 스타일) -->
  <g transform="translate(50,50)" fill="white">
    <!-- 수직 타원 -->
    <ellipse cx="0" cy="0" rx="9" ry="28"/>
    <!-- 수평 타원 -->
    <ellipse cx="0" cy="0" rx="28" ry="9"/>
    <!-- 대각선 타원 1 -->
    <ellipse cx="0" cy="0" rx="9" ry="28" transform="rotate(45)"/>
    <!-- 대각선 타원 2 -->
    <ellipse cx="0" cy="0" rx="9" ry="28" transform="rotate(-45)"/>
  </g>
</svg>
